<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- Content Security Policy - mirrors server-side CSP -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self' https://api.stripe.com *.google.com *.googleapis.com https://fonts.gstatic.com https://fonts.googleapis.com;
      img-src 'self' data: blob: https://*;
      font-src 'self' https://fonts.gstatic.com data:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      script-src 'self' 'unsafe-inline' https://js.stripe.com *.google.com *.googletagmanager.com;
      frame-src 'self' https://js.stripe.com *.google.com;
      worker-src 'self' blob:;
      object-src 'none';
    ">
    
    <meta name="description" content="WholeWellness Coaching Platform - Comprehensive nonprofit digital solution providing life coaching services to underserved individuals" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WholeWellness" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="WholeWellness Coaching Platform" />
    <meta property="og:description" content="Comprehensive nonprofit digital solution providing life coaching services to underserved individuals" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wholewellnesscoaching.org" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WholeWellness Coaching Platform" />
    <meta name="twitter:description" content="Comprehensive nonprofit digital solution providing life coaching services to underserved individuals" />
    
    <title>WholeWellness Coaching Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
